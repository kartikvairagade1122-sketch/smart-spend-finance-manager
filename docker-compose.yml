version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: smartspend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: smartspend
      MYSQL_USER: smartspend_user
      MYSQL_PASSWORD: smartspend_secure_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartspend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smartspend_user", "-psmartspend_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot REST API Service
  backend:
    build:
      context: .
      dockerfile: smart-spend-backend/Dockerfile
    container_name: smartspend-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartspend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smartspend_user
      SPRING_DATASOURCE_PASSWORD: smartspend_secure_pass
      JWT_SECRET: c21hcnQtc3BlbmQtZmluYW5jZS1tYW5hZ2VyLXNlY3VyZS1qd3Qta2V5LTIwMjYtbXVsdGktdXNlcg==
      JWT_ACCESS_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 604800000
    ports:
      - "8080:8080"
    networks:
      - smartspend-network

volumes:
  mysql_data:
    driver: local

networks:
  smartspend-network:
    driver: bridge
