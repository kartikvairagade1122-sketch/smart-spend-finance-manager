# ===================================================================
# SMART SPEND - TEST PROFILE CONFIGURATION (H2 in-memory DB)
# Tests run in full isolation without altering live MySQL records
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.currency.code=INR
app.currency.symbol=₹
